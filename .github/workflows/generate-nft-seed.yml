name: Generate NFT seed dump

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: generate-nft-seed
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "448120078528"
  ENVIRONMENT: nft

jobs:
  generate:
    runs-on: ubuntu-latest
    # GitHub-hosted runners are hard-capped at 360 minutes regardless of this setting - leave a
    # buffer under that for the other steps and the final status checks.
    timeout-minutes: 355
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.ENVIRONMENT }}-seed-data-generate
          aws-region: ${{ env.AWS_REGION }}
          # The seed + dump run can take hours; without this the assumed role's credentials
          # default to a 1 hour session and expire mid-poll. Must not exceed the role's
          # max_session_duration (see terraform/nft/ecs_task_definition/nft_seed/iam.tf).
          role-duration-seconds: 21600

      - name: Verify the seeded certificate object
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          if ! VERSION_ID=$(aws s3api head-object \
            --bucket prsdb-uploaded-files-nft \
            --key seeding/certificate_template.png \
            --query VersionId --output text 2>/dev/null); then
            echo "Certificate metadata preflight failed"
            exit 1
          fi
          if [[ -z "${VERSION_ID//[[:space:]]/}" || "$VERSION_ID" == "None" || "$VERSION_ID" == "null" ]]; then
            echo "Certificate metadata requires an immutable object version"
            exit 1
          fi
          echo "::add-mask::$VERSION_ID"
          printf 'version-id=%s\n' "$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve NFT task networking
        id: networking
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="${ENVIRONMENT}-app"
          CLUSTER="${ENVIRONMENT}-app"
          if ! SUBNETS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output json 2>/dev/null) ||
             ! SECURITY_GROUPS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' --output json 2>/dev/null); then
            echo "NFT task networking preflight failed"
            exit 1
          fi
          NETWORK_CONFIG=$(jq -cen --argjson subnets "$SUBNETS" --argjson groups "$SECURITY_GROUPS" \
            'select(($subnets | type == "array" and length > 0) and ($groups | type == "array" and length > 0)) |
             {awsvpcConfiguration: {subnets: $subnets, securityGroups: $groups, assignPublicIp: "DISABLED"}}')
          echo "::add-mask::$NETWORK_CONFIG"
          printf 'network-config=%s\n' "$NETWORK_CONFIG" >> "$GITHUB_OUTPUT"

      - name: Run full-scale NFT seeder and dump
        id: run-task
        env:
          CERTIFICATE_VERSION_ID: ${{ steps.certificate.outputs.version-id }}
          TASK_NETWORK: ${{ steps.networking.outputs.network-config }}
        shell: bash
        run: |
          set -euo pipefail
          OVERRIDES=$(jq -n --arg version "$CERTIFICATE_VERSION_ID" \
            '{containerOverrides: [{name: "nft-data-seeder", environment: [{name: "NFT_SEED_CERTIFICATE_VERSION_ID", value: $version}]}]}')
          if ! TASK_ARN=$(aws ecs run-task \
            --cluster "${ENVIRONMENT}-app" \
            --task-definition "prsdb-seed-data-${ENVIRONMENT}" \
            --launch-type FARGATE \
            --overrides "$OVERRIDES" \
            --network-configuration "$TASK_NETWORK" \
            --query 'tasks[0].taskArn' \
            --output text 2>/dev/null); then
            echo "Seed task request failed"
            exit 1
          fi
          if [[ "$TASK_ARN" != "arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:task/${ENVIRONMENT}-app/"* ]]; then
            echo "Seed task request did not return an NFT task"
            exit 1
          fi
          echo "::add-mask::$TASK_ARN"
          echo "Seed task started"
          # Recorded as a step output (not just a shell var) so the cleanup step below can still
          # find and stop the task if this step is cancelled or fails partway through polling.
          echo "task-arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

          # `aws ecs wait tasks-stopped` times out after 10 minutes (6s x 100 attempts), which
          # isn't long enough for a full-scale seed + dump run, so poll manually instead.
          # GitHub-hosted runners are hard-capped at 360 minutes (see the job's timeout-minutes),
          # so this can't wait longer than that - if seeding genuinely needs longer, this workflow
          # will need to move to a self-hosted runner or decouple the wait from the trigger.
          POLL_INTERVAL_SECONDS=30
          MAX_ATTEMPTS=680 # ~5h40, leaving a buffer under the job's 355 minute timeout
          STATUS=""
          for ((i = 0; i < MAX_ATTEMPTS; i++)); do
            # Don't let a transient AWS API error (throttling, network blip) kill a run that's
            # hours in - log it and retry on the next poll instead of exiting immediately.
            if ! STATUS=$(aws ecs describe-tasks --cluster "${ENVIRONMENT}-app" --tasks "$TASK_ARN" --query 'tasks[0].lastStatus' --output text 2>/dev/null); then
              echo "describe-tasks failed, will retry"
              sleep "$POLL_INTERVAL_SECONDS"
              continue
            fi
            case "$STATUS" in
              PROVISIONING|PENDING|ACTIVATING|RUNNING|DEACTIVATING|STOPPING|DEPROVISIONING|STOPPED)
                echo "Task status: $STATUS" ;;
              *)
                echo "Seed task status was unavailable"
                exit 1 ;;
            esac
            if [ "$STATUS" = "STOPPED" ]; then
              break
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done

          if [ "$STATUS" != "STOPPED" ]; then
            echo "Timed out waiting for task to stop after $((MAX_ATTEMPTS * POLL_INTERVAL_SECONDS / 60)) minutes"
            exit 1
          fi

          if ! DUMP_EXIT_CODE=$(aws ecs describe-tasks --cluster "${ENVIRONMENT}-app" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='nft-database-dump'].exitCode | [0]" --output text 2>/dev/null); then
            echo "Seed completion check failed"
            exit 1
          fi
          if [[ "$DUMP_EXIT_CODE" != "0" ]]; then
            echo "Seed dump failed"
            exit 1
          fi
          echo "Seed dump completed"

      - name: Stop ECS task if workflow was cancelled or failed
        if: failure() || cancelled()
        env:
          TASK_ARN: ${{ steps.run-task.outputs.task-arn }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TASK_ARN" ]; then
            echo "No task was started, nothing to stop"
            exit 0
          fi
          echo "Stopping the seed task"
          if ! aws ecs stop-task --cluster "${ENVIRONMENT}-app" --task "$TASK_ARN" --reason "Workflow run cancelled or failed" >/dev/null 2>&1; then
            echo "Seed task cleanup failed"
            exit 1
          fi
