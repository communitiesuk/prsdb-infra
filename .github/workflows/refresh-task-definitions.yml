name: Refresh Task Definition
on:
  workflow_call:
    inputs:
      environment:
        description: "The name of the environment to deploy to"
        type: string
        required: true
      aws-account-id:
        description: "The id of the AWS account to deploy to"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  retrieve-image:
    name: Retrieve latest ECR image
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "eu-west-2"
    outputs:
      image-uri: ${{ steps.retrieve-image.outputs.image-uri }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.environment }}-ecr-describe-images
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrieve latest image URI
        id: retrieve-image
        run: |
          IMAGE_TAG=$(aws ecr describe-images --repository-name ${{ inputs.environment }}-webapp --query 'sort_by(imageDetails, &imagePushedAt)[-1].imageTags[0]' --output text)
          IMAGE_URI="${{ inputs.aws-account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ inputs.environment }}-webapp:${IMAGE_TAG}"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  update-task-definition:
    name: Update ECS task definition
    needs: retrieve-image
    uses: ./.github/workflows/update-task-definition.yml
    with:
      environment: ${{ inputs.environment }}
      aws-account-id: ${{ inputs.aws-account-id }}
      image-uri: ${{ needs.retrieve-image.outputs.image-uri }}

  refresh-one-login-simulator:
    name: Refresh One Login simulator service
    if: ${{ inputs.environment == 'nft' }}
    needs: update-task-definition
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "eu-west-2"
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/github-actions-terraform-admin
          aws-region: ${{ env.AWS_REGION }}

      - name: Acquire shared NFT infrastructure lock
        env:
          LOCK_OWNER: simulator-refresh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          item=$(jq -cn --arg owner "$LOCK_OWNER" '{LockID:{S:"nft-performance-operation"},Owner:{S:$owner}}')
          aws dynamodb put-item --table-name tfstate-lock-nft --item "$item" \
            --condition-expression 'attribute_not_exists(LockID)'

      - name: Refresh One Login simulator service
        id: refresh
        run: |
          aws ecs update-service \
            --cluster nft-app \
            --service nft-one-login-simulator \
            --task-definition prsdb-one-login-simulator-nft \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster nft-app \
            --services nft-one-login-simulator

      - name: Release shared NFT infrastructure lock
        if: steps.refresh.outcome == 'success'
        env:
          LOCK_OWNER: simulator-refresh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          values=$(jq -cn --arg owner "$LOCK_OWNER" '{":owner":{S:$owner}}')
          aws dynamodb delete-item --table-name tfstate-lock-nft \
            --key '{"LockID":{"S":"nft-performance-operation"}}' \
            --condition-expression '#owner = :owner' \
            --expression-attribute-names '{"#owner":"Owner"}' \
            --expression-attribute-values "$values"