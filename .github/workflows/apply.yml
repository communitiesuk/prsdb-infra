name: Apply
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws-account-id:
        required: true
        type: string
      maintenance-mode-on:
        required: true
        type: boolean
      ip-restrictions-on:
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "eu-west-2"
  TF_VAR_critical_alarm_email_address: ${{ secrets.CRITICAL_ALARMS_EMAIL }}
  TF_VAR_non_critical_alarm_email_address: ${{ secrets.NON_CRITICAL_ALARMS_EMAIL }}
  TF_VAR_maintenance_mode_on: ${{ inputs.maintenance-mode-on }}
  TF_VAR_ip_restrictions_on: ${{ inputs.ip-restrictions-on }}

jobs:
  validate-target-environment:
    name: Validate target environment
    uses: ./.github/workflows/validate-target-environment.yml
    with:
      environment: ${{ inputs.environment }}

  refresh-task-definitions:
    name: Refresh task definitions
    # Wait for the main infra apply so any SSM parameters the ecs_task_definition
    # state reads (e.g. CloudWatch metric dimension ids) already exist, avoiding a
    # race where the task-def plan reads a parameter before apply creates it.
    # The apply job is skipped when the main infra has no changes, so proceed as
    # long as nothing it depends on failed or was cancelled.
    needs: apply
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/refresh-task-definitions.yml
    with:
      environment: ${{ inputs.environment }}
      aws-account-id: ${{ inputs.aws-account-id }}

  plan:
    name: Terraform plan
    needs: validate-target-environment
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.environment }}
    outputs:
      plan: ${{ steps.plan.outputs.stdout }}
      plan-exit-code: ${{ steps.plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/github-actions-terraform-ci-plan-read-only
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        # Exposes stdout, stderr and exitcode as outputs for any steps that run terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.1

      - name: Terraform init
        run: terraform init -input=false
        working-directory: terraform/${{ inputs.environment }}

      - name: Terraform plan
        id: plan
        # Terraform's "detailed-exitcode" codes are: 0 for "no changes", 1 for errors, 2 for "valid changes"
        # We don't save the plan as an artefact as it's sensitive and this repo is public
        run: terraform plan -input=false -detailed-exitcode
        continue-on-error: true
        working-directory: terraform/${{ inputs.environment }}

      - name: Fail job if plan failed
        if: steps.plan.outputs.exitcode == 1
        run: exit 1

      - name: Report pipeline status
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "environment": "${{ (inputs.environment == 'integration') && 'Integration' || (inputs.environment == 'production') && 'Production' || (inputs.environment == 'test') && 'Test' || inputs.environment }}",
              "commit": ${{ toJson(github.event.head_commit.message) }},
              "result": "${{ job.status == 'success' && 'Success :tick:' || 'Failure :no-cross:' }}",
              "url": "${{ format('https://github.com/communitiesuk/prsdb-infra/actions/runs/{0}', github.run_id) }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    if: needs.plan.outputs.plan-exit-code == 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/github-actions-terraform-admin
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.1

      - name: Acquire shared NFT infrastructure lock
        if: inputs.environment == 'nft'
        env:
          LOCK_OWNER: infra-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          item=$(jq -cn --arg owner "$LOCK_OWNER" '{LockID:{S:"nft-performance-operation"},Owner:{S:$owner}}')
          aws dynamodb put-item --table-name tfstate-lock-nft --item "$item" \
            --condition-expression 'attribute_not_exists(LockID)'

      - name: Terraform init
        run: terraform init -input=false
        working-directory: terraform/${{ inputs.environment }}

      - name: Terraform apply
        id: terraform_apply
        run: terraform apply -auto-approve -input=false
        working-directory: terraform/${{ inputs.environment }}

      - name: Release shared NFT infrastructure lock
        if: inputs.environment == 'nft' && steps.terraform_apply.outcome == 'success'
        env:
          LOCK_OWNER: infra-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          values=$(jq -cn --arg owner "$LOCK_OWNER" '{":owner":{S:$owner}}')
          aws dynamodb delete-item --table-name tfstate-lock-nft \
            --key '{"LockID":{"S":"nft-performance-operation"}}' \
            --condition-expression '#owner = :owner' \
            --expression-attribute-names '{"#owner":"Owner"}' \
            --expression-attribute-values "$values"

      - name: Report pipeline status
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "environment": "${{ (inputs.environment == 'integration') && 'Integration' || (inputs.environment == 'production') && 'Production' || (inputs.environment == 'test') && 'Test' || inputs.environment }}",
              "commit": ${{ toJson(github.event.head_commit.message) }},
              "result": "${{ job.status == 'success' && 'Success :tick:' || 'Failure :no-cross:' }}",
              "url": "${{ format('https://github.com/communitiesuk/prsdb-infra/actions/runs/{0}', github.run_id) }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}